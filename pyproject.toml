[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fahrai-policy-calibration"
version = "1.0.0"
description = "Synthetic experiments on recalibration after changes in task selection"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "matplotlib==3.10.8"]

[project.scripts]
fahrai-calibration = "fahrai_calibration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
